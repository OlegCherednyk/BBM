<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Період</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body data-admin-page="stats">
    <main style="max-width:390px;margin:0 auto;padding:24px 16px 40px">
      <h1>Аналітика</h1>
      <div class="admin-panel admin-stats-filter-panel">
        <div class="admin-stats-quick" id="statsQuickBtns">
          <button type="button" class="admin-stats-quick__btn" data-quick="month">Цей місяць</button>
          <button type="button" class="admin-stats-quick__btn" data-quick="prev-month">Минулий</button>
          <button type="button" class="admin-stats-quick__btn" data-quick="3months">3 міс.</button>
          <button type="button" class="admin-stats-quick__btn" data-quick="6months">6 міс.</button>
          <button type="button" class="admin-stats-quick__btn" data-quick="year">Рік</button>
        </div>
        <button type="button" class="admin-stats-range-field" id="statsRangeField">
          <span id="statsRangeFromLabel">оберіть</span>
          <span class="admin-stats-range-field__arrow">→</span>
          <span id="statsRangeToLabel">оберіть</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </button>
        <form hidden>
          <input id="statsDateFrom" type="date" value="2026-09-01" />
          <input id="statsDateTo" type="date" value="2026-09-14" />
        </form>
      </div>
    </main>
    <div id="statsCalendarSheet" class="admin-sheet admin-hide" aria-hidden="true">
      <div class="admin-sheet__backdrop" data-sheet-close></div>
      <div class="admin-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="statsCalendarMonth">
        <div class="admin-sheet__grab"></div>
        <div class="admin-stats-ends">
          <div class="admin-stats-end"><b>Від</b><strong id="statsDraftFrom">оберіть</strong></div>
          <span class="admin-stats-range-field__arrow">→</span>
          <div class="admin-stats-end"><b>До</b><strong id="statsDraftTo">оберіть</strong></div>
        </div>
        <div class="admin-stats-month">
          <button type="button" id="statsCalendarPrev" aria-label="Попередній місяць">‹</button>
          <span id="statsCalendarMonth">Місяць</span>
          <button type="button" id="statsCalendarNext" aria-label="Наступний місяць">›</button>
        </div>
        <div id="statsCalendarGrid" class="admin-stats-cal"></div>
        <div class="admin-stats-sheet-actions">
          <button type="button" class="btn btn--ghost btn--sm" data-sheet-close>Скасувати</button>
          <button type="button" class="btn btn--primary btn--sm" id="statsCalendarOk">Гаразд</button>
        </div>
      </div>
    </div>
    <script type="module">
      import { mountStatsRange } from "../assets/js/stats-range.js";
      mountStatsRange({
        fromEl: document.getElementById("statsDateFrom"),
        toEl: document.getElementById("statsDateTo"),
        onChange() {},
      });
    </script>
  </body>
</html>
