<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Day — мозок.тіло.рух</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?r=9" />
    <link rel="icon" href="assets/logo.png" />
  </head>
  <body class="play">
    <section class="hero" aria-label="Тизер Open Day">
      <div class="stage">
        <p class="edge edge-l">обирай здорове й сильне тіло</p>
        <div class="edge edge-r">
          <span>обирай свідомий рух</span>
          <span>тіло знижує тривожність</span>
        </div>
        <div class="cluster cluster-top">
          <img src="assets/cluster-top.jpg" alt="Тестуй нові напрями" />
        </div>
        <div class="lockup">
          <p class="brand">мозок.тіло.рух</p>
          <h1 class="word" aria-label="OPEN DAY">
            <span class="letter" style="--i:0">O</span>
            <span class="letter" style="--i:1">P</span>
            <span class="letter" style="--i:2">E</span>
            <span class="letter" style="--i:3">N</span>
            <span class="gap"></span>
            <span class="letter" style="--i:4">D</span>
            <span class="letter" style="--i:5">A</span>
            <span class="letter" style="--i:6">Y</span>
          </h1>
          <div class="dates">
            <p><span class="d1">03.10</span><span class="d2">«ґрунт»</span></p>
            <p><span class="d1">04.10</span><span class="d2">«паростки»</span></p>
          </div>
          <a class="reg" href="form.html" aria-label="Реєстрація">
            <span style="--i:0">Р</span><span style="--i:1">Е</span><span style="--i:2">Є</span><span style="--i:3">С</span><span style="--i:4">Т</span><span style="--i:5">Р</span><span style="--i:6">А</span><span style="--i:7">Ц</span><span style="--i:8">І</span><span style="--i:9">Я</span>
          </a>
          <button class="soon soon-details" id="details" type="button" aria-expanded="false">деталі</button>
        </div>
        <div class="cluster cluster-bot">
          <img src="assets/cluster-bot.jpg" alt="Два дні, знижки на перший абонемент" />
        </div>
      </div>
    </section>

    <div class="story" id="story"></div>
    <script src="landing.js?r=6"></script>
  </body>
</html>
